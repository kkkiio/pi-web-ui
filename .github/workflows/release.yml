name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${pkg_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${pkg_version}" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: |
          npx tsc --noEmit
          npm run check
          npm run build:web
          npm pack --dry-run --json

      - name: Publish to npm (Trusted Publishing OIDC)
        shell: bash
        run: |
          set -euo pipefail
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          if npm view "${pkg_name}@${pkg_version}" version > /dev/null 2>&1; then
            echo "Skipping ${pkg_name}@${pkg_version} (already published)"
            exit 0
          fi
          echo "Publishing ${pkg_name}@${pkg_version}..."
          npm publish --access public
