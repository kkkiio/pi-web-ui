name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  web-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: |
          npx tsc --noEmit
          npm run check:extension
          npm run check

      - name: Build
        run: npm run build:web

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run real Pi E2E
        run: npm run e2e

  readme-snapshot:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    env:
      PI_WEB_UI_README_SNAPSHOT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies and build
        run: npm ci

      - name: Compare the README screenshot
        run: |
          npm run e2e:gen
          npx playwright test -c e2e/playwright.config.ts --project=readme

      - name: Upload screenshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: readme-snapshot-diff
          path: test-results/
          if-no-files-found: ignore
